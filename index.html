<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arpon Kumar Sarkar Sumit | Portfolio</title>
<meta name="description" content="Portfolio of Arpon Kumar Sarkar Sumit, CSE student at IUBAT working on medical image analysis and explainable AI.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="nav">
  <a href="#top" class="brand" id="brand"></a>
  <nav id="menu" aria-label="Main"></nav>
  <div class="nav-tools">
    <button id="theme" class="icon-btn" aria-label="Switch light or dark theme"></button>
    <button class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false">Menu</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <canvas id="scan" aria-hidden="true"></canvas>
    <div class="hero-text">
      <p class="hello">Hi, I'm</p>
      <h1 id="name"></h1>
      <p class="role">I work on <span id="typed"></span><span class="cursor" aria-hidden="true">|</span></p>
      <p class="lead" id="tagline"></p>
      <div class="actions">
        <a class="btn primary" href="#projects">View my projects</a>
        <a class="btn" href="#contact">Contact me</a>
      </div>
    </div>
  </section>

  <section class="stats" id="stats" aria-label="Highlights"></section>

  <section id="about" class="section"><h2>About me</h2><div class="two-col" id="about-body"></div></section>
  <section id="skills" class="section alt"><h2>Skills</h2><div class="skill-grid" id="skill-body"></div></section>
  <section id="education" class="section"><h2>Education</h2><ol class="timeline" id="edu-body"></ol></section>

  <section id="projects" class="section alt">
    <h2>Projects</h2>
    <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
    <div class="project-list" id="project-body"></div>
  </section>

  <section id="achievements" class="section"><h2>Achievements</h2><ul class="ach" id="ach-body"></ul></section>

  <section id="contact" class="section alt">
    <h2>Contact</h2>
    <p class="contact-lead">Want to talk about research, a project or an opportunity? Send me a message.</p>
    <form id="contact-form" novalidate>
      <label>Name<input type="text" name="name" required autocomplete="name"></label>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Message<textarea name="message" rows="5" required></textarea></label>
      <button class="btn primary" type="submit">Send message</button>
      <p id="form-status" role="status"></p>
    </form>
    <p class="links" id="links"></p>
  </section>
</main>

<dialog id="modal">
  <button class="close" aria-label="Close" id="modal-close">&times;</button>
  <div id="modal-body"></div>
</dialog>

<button id="to-top" class="to-top" aria-label="Back to top" hidden>&uarr;</button>
<footer><p>&copy; <span id="year"></span> <span id="foot-name"></span>. Built with HTML, CSS and JavaScript.</p></footer>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
